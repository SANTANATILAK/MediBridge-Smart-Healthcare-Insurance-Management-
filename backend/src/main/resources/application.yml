server:
  port: ${PORT:8080}

spring:
  application:
    name: medibridge-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medibridge}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:medibridge}
    password: ${DB_PASSWORD:medibridge}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # Override JWT_SECRET in every real deployment (min. 32 characters)
    secret: ${JWT_SECRET:medibridge-demo-secret-key-change-me-in-production-2026}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
